name: Feature request
description: Propose something new.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Read [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) before opening. Major architectural changes need discussion here *before* a PR. Don't surprise the maintainer with a 2000-line PR.
  - type: textarea
    id: what
    attributes:
      label: What you want
      description: One paragraph. Be specific.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: Concrete use case or problem you're trying to solve. "It would be nice if..." is not a use case.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you've already tried
      description: Workarounds, related tools, alternative designs you considered.
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Is this a core feature, a plugin candidate, or something downstream tools should do? Honest answers preferred.
    validations:
      required: false
